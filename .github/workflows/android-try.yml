# Not for the pull request: the work branch's own check while part 2 is built. Builds the debug
# APK for x86-64, runs it on an Android 14 emulator, and keeps screenshots and the device's log.
name: android-try

on:
  push:
    branches: ["android-shell*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-try-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  # A quicker release build than the shipped one's (fat LTO, one unit).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  run:
    name: Build and run on the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-try
      - name: Rust target, cargo-ndk and the NDK
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build the debug APK for x86-64
        working-directory: android
        run: ./gradlew assembleDebug -Pmdm.abis=x86_64
      - name: The lab server (the emulator downloads from it at 10.0.2.2)
        run: cargo build --release -p mdm-labserver
      - name: Make room for the emulator
        run: rm -rf target/x86_64-linux-android/release/deps target/x86_64-linux-android/release/build && df -h /
      - name: Run it on Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone's screen (1080 × 2400 at 420 dpi), not the emulator's small default.
          profile: pixel_6
          disable-animations: true
          script: bash tools/android/try.sh
      - name: Screenshots and the device's log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-try
          path: try-out/
